server:
  port: 3000

# Actuator 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# SpringDoc OpenAPI (Swagger UI) 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

spring:
  profiles:
    # 默认 prod，本地开发时通过 IDE/命令行参数 --spring.profiles.active=dev 切换
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: aitrainer-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_trainer}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

  # 邮件服务配置 (以 QQ 邮箱为例)
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted  # 全局逻辑删除字段名
      logic-delete-value: 1          # 逻辑已删除值
      logic-not-delete-value: 0      # 逻辑未删除值

jwt:
  # JWT 签名密钥，从环境变量 JWT_SECRET 读取；必须 ≥64 字符（HS512 算法要求）
  secret: ${JWT_SECRET:base64EncodedSecretKeyForAiTrainerApplicationThatMustBeLongEnough}
  expiration: 604800000 # 7 days

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    avatar-url-expire-seconds: ${ALIYUN_OSS_AVATAR_URL_EXPIRE_SECONDS:90000}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${AI_API_KEY:}
      model-name: ${AI_MODEL:gpt-5.4}
      base-url: ${AI_BASE_URL:https://ai.sandboxai.top/v1/}
      timeout: 120s
      max-tokens: 2000
      max-retries: 1
      log-requests: true
      log-responses: true
