# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name aitrainer.fun www.aitrainer.fun;
    return 301 https://$host$request_uri;
}

# HTTPS 主站
server { 
    listen 443 ssl http2;
    server_name aitrainer.fun www.aitrainer.fun;

    ssl_certificate     /etc/letsencrypt/live/aitrainer.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitrainer.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /swagger-ui/ { proxy_pass http://backend:3000; }
    location /v3/api-docs { proxy_pass http://backend:3000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}